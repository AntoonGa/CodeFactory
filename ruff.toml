target-version = "py313"
line-length = 100
src = ["src/python", "tests"]
# QA suites in qa/ are not part of CI. See CLAUDE.md.
extend-exclude = ["qa"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit (security)
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
