name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job is named `check`: the main ruleset requires a status check with that
# name. It runs `just ci`, so CI and the agents run the very same checks.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v3

      # Add the setup for your stack here, for example:
      # - uses: astral-sh/setup-uv@v6        # Python
      # - uses: actions/setup-node@v4        # Node
      # Pin third-party actions to a commit SHA once the project matters.

      - name: Run the checks
        run: just ci
